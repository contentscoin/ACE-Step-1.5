name: MusicStudio CI

# Product-layer CI (design §12.1): shares GitHub Actions with the host
# repository but is separated by path filters so it never runs for engine
# changes and the engine workflows never run for product-layer changes.
on:
  push:
    branches: [main]
    paths:
      - 'musicstudio/**'
      - '.github/workflows/musicstudio-ci.yml'
  pull_request:
    paths:
      - 'musicstudio/**'
      - '.github/workflows/musicstudio-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicstudio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check for design §14 risk #9: musicstudio/ must not import acestep/.
  import-boundary:
    name: Import boundary (musicstudio -> acestep)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: musicstudio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: musicstudio/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: TypeScript boundary rules (ESLint)
        run: npm run lint

      - name: Python boundary check
        run: python dsp/scripts/check_import_boundary.py

  typescript:
    name: TypeScript (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: musicstudio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: musicstudio/package-lock.json

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Task 9.2. Fails the build when design §10 defines a Correctness Property that no
      # test declares, when two tests declare the same one, or when a declared property
      # runs below the 100 cases §10 requires. It reads the property list out of the design
      # document, so a property added there is demanded here the same day.
      - name: Property coverage audit (design §10)
        run: npm run check:properties

  # The suite is sharded so that no vitest process outlives the reporting RPC's
  # timeout. A worker reports progress by awaiting `onTaskUpdate` over birpc,
  # which gives up after a hardcoded 60 s that vitest does not expose to config.
  # The whole suite takes ~103 s on this runner, so a call left unanswered has
  # room to reach that ceiling; the timeout then throws in the worker and vitest
  # counts it as an unhandled error, failing a run in which all 2666 tests
  # passed. The longest shard measures ~51 s, roughly halving the exposure.
  #
  # Sharding rather than a hand-written list of paths, so that adding a test
  # file cannot unbalance the split or leave it unrun — `--shard` covers every
  # file vitest collects. Four shards, because the floor is set by the single
  # heaviest file (`sound-pack/cue-synthesis` ~30 s) and cannot be split
  # further: six shards measured no faster (53.9 s) than four.
  #
  # A matrix rather than sequential steps: the shards run concurrently, so the
  # split shortens the critical path instead of adding four cold starts to it.
  typescript-tests:
    name: TypeScript tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one failure does not hide the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: musicstudio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: musicstudio/package-lock.json

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Test (vitest + fast-check)
        run: npm test -- --shard=${{ matrix.shard }}/4

  # Task 7.1's web SPA. A separate job because it has its own lockfile and its own
  # toolchain (design §1.4.2), and because the motion check of Requirement 31.5 must
  # be a gate rather than something a developer remembers to run: a spring literal
  # has to fail CI for "빌드 산출물을 생성하지 않는다" to mean anything.
  #
  # `npm run build` runs the check, then `tsc --noEmit`, then Vite — so this one step
  # covers 31.5's gate and 31.15's offline build together. The runner has a network,
  # so the offline half is a property of the build *script* (nothing fetches) rather
  # than of the runner; `web/src/components/amicro/README.md` records why.
  web:
    name: Web (static checks + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: musicstudio/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: musicstudio/web/package-lock.json

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Motion preset static check (Requirement 31.5)
        run: npm run check:motion

      - name: Sound runtime size check (Requirement 32.17)
        run: npm run check:sound

      - name: Accessibility static check (Requirements 31.11, 31.13, 31.14)
        run: npm run check:a11y

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

  dsp:
    name: DSP worker (pytest + hypothesis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: musicstudio/dsp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: musicstudio/dsp/pyproject.toml

      # Task 9.3's acceptance criterion is 실패 0건·**건너뜀 0건**. `test_codecs.py`'s
      # fallback tests shell out to an ffmpeg-compatible binary (design §5.5 makes pydub
      # a *subprocess* dependency, not a wheel one), so without the binary they skip and
      # the design's only redundancy for format conversion goes unexercised.
      - name: Install the codec backend
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install DSP dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev,audio]'

      - name: Test (pytest + hypothesis)
        # `-rs` prints the reason for anything skipped, so a skip that creeps back in is
        # visible in the log rather than buried in the counts.
        run: pytest -rs

  # Task 9.3's acceptance criterion is "실패 0건·**건너뜀 0건**", and the migration
  # acceptance suite is the only thing in the repository that skips: it needs a real
  # PostgreSQL, and without one `db-schema.test.ts` skipped all 20 of its cases.
  #
  # That skip was not free. It hid a migration that **could not be applied at all** —
  # `0013_effect_preset.sql` carried a CHECK constraint containing a subquery, which
  # PostgreSQL rejects outright (`0A000`). Every pure test passed for months against SQL
  # no server would accept. This job is what stops that recurring.
  database:
    name: Database migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: musicstudio
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: musicstudio_test
        ports:
          - 5432:5432
        # The suite connects immediately; without a health gate the first query races
        # the server's own startup and fails on a cold runner roughly one run in five.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Slice S4 (docs/ROADMAP.md §4.4): the credit store's Lua scripts are asserted
      # against a real server here, not only against the in-process double. Same
      # health gate reasoning as postgres above.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: musicstudio/package-lock.json

      - name: Install Node dependencies
        run: npm ci || npm install

      # A throwaway database, because the suite creates the whole product schema in the
      # `public` namespace — see the header of `test/integration/db-schema.test.ts`.
      # The Redis URL gates the credit-store contract the same way; without it that
      # file skips, which is what happens on a developer machine with no server.
      - name: Migration acceptance
        run: npm run test:db
        env:
          MUSICSTUDIO_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/musicstudio_test
          MUSICSTUDIO_REDIS_URL: redis://localhost:6379
