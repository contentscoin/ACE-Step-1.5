[project]
# DSP worker dependencies are declared here, independently of the repository
# root pyproject.toml (design §1.4.2, §12.1). The engine's PyTorch/CUDA
# resolution and the product layer's DSP resolution must never constrain
# each other, so the two Python environments are resolved separately.
name = "musicstudio-dsp"
version = "0.0.0"
description = "MusicStudio DSP worker — resampling, effects, loudness, onset, mixdown chain (design §5)"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    # libsndfile is bundled in the wheel and covers all four download formats of
    # Requirements 13.2 and 13.9 (wav/flac at PCM_24, mp3, ogg/vorbis), so the
    # primary conversion path needs no external binary. See dsp/src/.../formats.py.
    "soundfile>=0.13.1",
    # libsoxr, bundled in the wheel. Design §5.2's VHQ resampler. Self-contained:
    # no system library, no compiler, ~200 kB — so the base pipeline of task 3.1
    # stays installable by `pip install -e '.[dev]'` alone, which is what CI runs.
    "soxr>=0.5",
    # The worker framework itself (design §2.3, §11.3). Pure-Python wheels, no
    # system dependency, and only `worker.py` imports it — the pipeline functions
    # are broker-free by construction, so tests never reach a connection.
    "celery>=5.4",
    # Design §5.5's effect library: the eight kinds of Requirement 29.1
    # (dsp/src/musicstudio_dsp/effects.py). In the default set rather than the
    # `audio` extra for the same reason `soxr` and `celery` are — **CI runs
    # `pip install -e '.[dev]'` only**, so anything the ordinary test suite needs
    # must be resolvable by that command, and the effects tests are ordinary tests.
    #
    # It qualifies: a self-contained manylinux_2_28 wheel, ~5 MB, whose only Python
    # dependency is numpy. It is not *quite* as free-standing as `soxr` — the native
    # extension links `libatomic.so.1`, which the wheel does not bundle. That library
    # is part of the GCC runtime and is present on the `ubuntu-latest` runner this
    # project's CI uses, so no workflow change is needed. Because it is nevertheless a
    # platform dependency rather than a wheel dependency, `effects.pedalboard_available`
    # exists and the effects tests skip with a stated reason on a host without it,
    # rather than failing collection.
    "pedalboard>=0.9.12",
    # Design §5.5's loudness library: BS.1770-4 measurement and normalisation for
    # Requirement 30.24 (dsp/src/musicstudio_dsp/loudness.py). Moved out of the `audio`
    # extra by task 3.3, for the same reason `pedalboard` is in the default set — **CI runs
    # `pip install -e '.[dev]'` only**, so anything the ordinary test suite needs must be
    # resolvable by that command, and `test_loudness.py`/`test_mastering.py` are ordinary
    # tests. Leaving it in the extra would have made every mastering test skip in CI.
    #
    # It qualifies more easily than `pedalboard` did: pure Python over numpy and scipy, no
    # native extension of its own and therefore no platform library to be missing. `scipy`
    # arrives with it as a manylinux wheel (~35 MB) — the only real cost, and one already
    # implied by design §5.5 naming the library.
    "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
# Audio processing stack (design §5, §12). Kept as an extra so that lint,
# type checks and the property harness can run without the heavy wheels.
#
# `pydub` belongs here rather than in the default set for a different reason than
# the other three: it is small, but its mp3/ogg codecs shell out to an `ffmpeg`
# or `avconv` binary, so it is a *subprocess* dependency on the machine rather
# than a wheel dependency. Design §5.5 names it the fallback for format
# conversion and `dsp/src/musicstudio_dsp/codecs.py` is the seam to it; the
# primary path is libsndfile. Tests for the fallback skip, with the reason
# stated, when no binary is present.
audio = [
    "librosa>=0.10.2",
    "pydub>=0.25.1",
]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicstudio_dsp"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-q"
